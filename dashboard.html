<!DOCTYPE html>
<html>
  <head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <!-- Header -->
    <iframe
      id="headerFrame"
      src="header.html"
      class="w-full border-none"
      onload="resizeIframe(this)"
    ></iframe>

    <!-- Main Content -->
    <main>
      <!-- Filters -->
      <iframe
        id="filtersFrame"
        src="filters.html"
        class="w-full border-none"
        onload="resizeIframe(this)"
      ></iframe>

      <!-- Results -->
      <iframe
        id="resultsFrame"
        src="Results.html"
        class="w-full border-none"
        onload="resizeIframe(this)"
      ></iframe>

      <!-- Property Cards -->
      <iframe
        id="cardsFrame"
        src="propertyCards.html"
        class="w-full border-none"
        onload="resizeIframe(this)"
      ></iframe>
    </main>

    <script>
      function resizeIframe(iframe) {
        try {
          const height = iframe.contentWindow.document.body.scrollHeight;
          iframe.style.height = height + "px";
        } catch (e) {
          console.log("Iframe resize error:", e);
        }
      }

      // Resize when window changes (mobile rotation, small screens etc.)
      window.addEventListener("resize", () => {
        resizeIframe(document.getElementById("headerFrame"));
        resizeIframe(document.getElementById("filtersFrame"));
        resizeIframe(document.getElementById("resultsFrame"));
        resizeIframe(document.getElementById("cardsFrame"));
      });
    </script>
  </body>
</html>
